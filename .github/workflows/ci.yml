name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Formatting, model-free tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run model-free Rust tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test the regression harness without models
        run: python3 -m unittest discover -s tests/regression -p 'test_*.py' -v

  model-tests:
    name: ONNX model and public image regressions
    needs: fast-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev curl python3 time
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Cache DOCSAID models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: docsaid-models-${{ hashFiles('scripts/download_models.sh') }}
      # Always run, even on cache hits: the script verifies both SHA-256 hashes.
      - name: Download and verify model weights
        run: ./scripts/download_models.sh
      - name: Run explicit model tests and full public regressions
        run: ./scripts/test_models.sh
