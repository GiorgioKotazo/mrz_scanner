[package]
name = "mrz_scanner"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27", default-features = false }
mrz = "0.9.1"
ndarray = "0.17"
ort = "=2.0.0-rc.15"
serde_json = "1.0"
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }

[dev-dependencies]
calamine = "0.37"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
